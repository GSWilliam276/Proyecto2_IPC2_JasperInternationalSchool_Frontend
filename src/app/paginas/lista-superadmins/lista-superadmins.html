<section class="bg-white rounded-xl shadow-md p-6">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <h3 class="text-lg font-semibold text-texto">SuperAdmins</h3>
    <!-- (input) se dispara en cada tecla; alEscribir espera a que se deje de escribir -->
    <input type="search" placeholder="Buscar por nombre o correo"
      (input)="alEscribir($any($event.target).value)"
      class="rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primario" />
  </div>

  @if (error()) {
    <p class="text-sm text-acento bg-red-50 rounded-lg px-3 py-2 mb-3">{{ error() }}</p>
  }

  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left">
      <thead class="bg-primario-claro text-primario-oscuro">
        <tr>
          <th class="px-3 py-2">Nombre</th>
          <th class="px-3 py-2">Correo</th>
          <th class="px-3 py-2">Teléfono</th>
          <th class="px-3 py-2">CUI</th>
          <th class="px-3 py-2">Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (u of usuarios(); track u.idUsuario) {
          <tr class="border-b border-gray-100">
            <td class="px-3 py-2">{{ u.nombre }}</td>
            <td class="px-3 py-2">{{ u.correo }}</td>
            <td class="px-3 py-2">{{ u.telefono }}</td>
            <td class="px-3 py-2">{{ u.cui }}</td>
            <td class="px-3 py-2">{{ u.estado }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="px-3 py-6 text-center text-gray-500">
              {{ cargando() ? 'Cargando...' : 'No se encontraron resultados' }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="flex items-center justify-between mt-4">
    <button type="button" (click)="anterior()" [disabled]="pagina() === 1"
      class="px-3 py-1 rounded-lg bg-primario text-white disabled:opacity-40">Anterior</button>
    <span class="text-sm text-texto">Página {{ pagina() }}</span>
    <button type="button" (click)="siguiente()" [disabled]="!hayMas()"
      class="px-3 py-1 rounded-lg bg-primario text-white disabled:opacity-40">Siguiente</button>
  </div>
</section>
