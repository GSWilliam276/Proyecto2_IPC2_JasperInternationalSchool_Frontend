<main class="min-h-screen bg-fondo flex items-center justify-center p-4">
  <section class="max-w-md bg-white rounded-xl shadow-md p-8 text-center">
    <h1 class="text-xl font-semibold text-texto">Sin acceso</h1>
    <p class="text-sm text-texto mt-2">Su rol no tiene permiso para ver esta pantalla.</p>
    <button type="button" (click)="volver()"
      class="mt-4 bg-primario text-white rounded-lg px-4 py-2 hover:bg-primario-oscuro transition-colors">
      Volver al inicio de sesión
    </button>
  </section>
</main>
