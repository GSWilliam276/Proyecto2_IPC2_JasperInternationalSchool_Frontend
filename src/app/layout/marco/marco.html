<div class="min-h-screen flex bg-fondo">

  <!-- Menu lateral -->
  <aside class="w-60 bg-primario-oscuro text-white flex flex-col">
    <div class="flex items-center gap-3 px-5 py-5 border-b border-white/10">
      <img src="logo-claro.svg" alt="Logo de Jasper International School" class="h-12 w-auto" />
      <span class="text-sm font-semibold leading-tight">Jasper International School</span>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1">
      <a routerLink="/inicio" routerLinkActive="bg-primario text-white"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-primario-claro hover:bg-primario hover:text-white transition-colors">
        <i class="bi bi-house-door text-base"></i> Inicio
      </a>
      @for (opcion of menu; track opcion.ruta) {
        <!-- routerLinkActive marca el enlace de la pantalla en la que se esta -->
        <a [routerLink]="opcion.ruta" routerLinkActive="bg-primario text-white"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-primario-claro hover:bg-primario hover:text-white transition-colors">
          <i [class]="'bi bi-' + opcion.icono + ' text-base'"></i> {{ opcion.etiqueta }}
        </a>
      }
    </nav>
  </aside>

  <!-- Zona derecha: barra superior, contenido y pie -->
  <div class="flex-1 flex flex-col min-w-0">

    <header class="bg-white shadow-sm border-b-2 border-primario px-6 py-3 flex items-center justify-between gap-4">
      <div>
        <p class="font-titulo text-lg font-bold text-primario-oscuro leading-tight">Jasper International School</p>
        <p class="text-xs text-gray-500">Sistema de gestión escolar</p>
      </div>

      <div class="flex items-center gap-3">
        <!-- nombre y rol de quien inicio sesion -->
        <div class="text-right leading-tight">
          <p class="text-sm font-semibold text-texto">{{ sesion?.nombre }}</p>
          <span class="inline-block mt-0.5 text-xs rounded-full bg-primario-claro text-primario-oscuro px-2 py-0.5">
            {{ sesion?.rol }}
          </span>
        </div>

        <!-- avatar con iniciales -->
        <div class="h-10 w-10 shrink-0 rounded-full bg-primario text-white flex items-center justify-center text-sm font-bold ring-2 ring-primario-claro">
          {{ iniciales }}
        </div>

        <!-- separador visual entre la persona y sus acciones -->
        <span class="hidden sm:block h-8 w-px bg-gray-200 mx-1"></span>

        <!-- en pantallas medianas solo se ve el icono; desde lg tambien el texto -->
        <a routerLink="/cambiar-contrasena" title="Cambiar contraseña"
          class="flex items-center gap-2 whitespace-nowrap rounded-lg border border-primario text-primario text-sm px-3 py-2 hover:bg-primario-claro transition-colors">
          <i class="bi bi-key"></i><span class="hidden lg:inline">Contraseña</span>
        </a>
        <button type="button" (click)="cerrarSesion()" title="Cerrar sesión"
          class="flex items-center gap-2 whitespace-nowrap rounded-lg bg-primario-oscuro text-white text-sm px-3 py-2 hover:bg-acento transition-colors">
          <i class="bi bi-box-arrow-right"></i><span class="hidden lg:inline">Cerrar sesión</span>
        </button>
      </div>
    </header>

    <!-- Aqui Angular muestra la pantalla que corresponde a la ruta actual -->
    <main class="flex-1 p-6">
      <router-outlet />
    </main>

    <footer class="px-6 py-3 text-xs text-gray-500 border-t border-gray-200">
      Jasper International School · {{ anio }}
    </footer>
  </div>
</div>
